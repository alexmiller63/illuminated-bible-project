illuminated_bible:

  project:

    name: "The Illuminated Bible"

    prototype:

      passages:

        - book: Genesis

          chapter: 1

          verses: "1-31"

        - book: John

          chapter: 1

          verses: "1-10"

  translations:

    editorial_sources:

      - code: BBE

        name: "Bible in Basic English"

      - code: WEB

        name: "World English Bible"

    verse_selection:

      rule: >

        Each verse is considered independently. The editor selects

        either BBE or WEB as the source of the illuminated verse,

        according to which rendering is clearer, stronger, more

        expressive, or otherwise better suited to the purposes of

        the Illuminated Bible.

      source_label:

        enabled: true

        values:

          - BBE

          - WEB

    translation_fidelity:

      rule: >

        The illuminated text preserves the wording of the selected

        English translation exactly. Illumination annotates the

        translation; it does not rewrite, correct, harmonize, or

        modernize it.

      original_language_note: >

        An illuminated original-language term may differ in number,

        grammatical form, semantic range, or nuance from its English

        rendering. Those differences belong in the illumination and

        explanatory material rather than as alterations to the

        selected English translation.

    web_parallel_text:

      enabled: true

      rule: >

        Every illuminated verse is followed by the corresponding

        verse from the World English Bible.

      source_label:

        enabled: false

      purpose: >

        This preserves the complete WEB text in canonical order,

        allowing a reader to read the entire World English Bible

        continuously even when individual illuminated verses use

        the BBE as their editorial source.

  illumination:

    definition: >

      Illumination is linguistic rather than pictorial. Selected

      biblically significant words or phrases within the English

      verse are expanded to reveal important information from the

      original biblical language.

    selection_principle: >

      Words and phrases are selected for illumination because of

      their biblical significance, not merely because they are

      nouns or other content words.

    verse_independence:

      rule: >

        Every verse must be capable of serving as a reader's first

        encounter with the Illuminated Bible. An otherwise warranted

        illumination must not be omitted merely because the same word

        or expression was illuminated in an earlier verse.

    compound_expressions:

      rule: >

        When biblical or linguistic significance belongs to a

        compound expression, the expression should be illuminated

        as a unit rather than artificially divided into separate

        word illuminations.

    significance_categories:

      - theological

      - divine_name

      - canonical

      - literary

      - covenantal

      - ritual

      - prophetic

      - christological

      - cultural

      - historical

      - linguistic

      - grammatical

      - cosmological

      - worldview

      - recurring_biblical_term

      - title_or_book_name

      - paired_concept

      - translation_nuance

    selection_guidelines:

      illuminate_when:

        - >

          A word is a divine name or title.

        - >

          A word is central to an important biblical or theological

          concept.

        - >

          The original-language word conveys meaning or nuance that

          is obscured or reduced in English translation.

        - >

          The word has unusual or significant grammatical features.

        - >

          The word has canonical importance elsewhere in Scripture.

        - >

          The word or phrase functions as a traditional title or

          name of a biblical book or section.

        - >

          The word participates in an important recurring biblical

          motif.

        - >

          The original-language term provides useful cultural or

          historical information.

        - >

          The original-language term may provide insight into the

          worldview or conceptual framework of the biblical writer.

        - >

          Two or more terms form an important conceptual pair and

          illuminating them together adds understanding.

        - >

          A translation choice conceals an important feature of the

          original-language expression.

      do_not_illuminate_merely_because:

        - the_word_is_a_noun

        - the_word_is_a_verb

        - the_word_is_a_content_word

        - the_word_is_concrete

        - the_word_occurs_frequently

        - the_word_seems_important_in_English

      editorial_restraint: >

        Illumination should add understanding rather than clutter.

        Not every word for which an original-language equivalent can

        be supplied should be illuminated.

  illuminated_word:

    display_order:

      - english

      - original_language

      - transliteration

      - ipa

    rule: >

      The English word or phrase remains in its normal position in

      the selected English verse. Its original-language form,

      transliteration, and IPA pronunciation follow it inline.

      Reading then resumes with the next portion of the English verse.

    fields:

      english:

        required: true

      original_language:

        required: true

      transliteration:

        required: true

      ipa:

        required: true

  footnotes:

    enabled: true

    numbering:

      style: numeric

      restart: page

    placement: bottom_of_page

    rule: >

      Detailed lexical, textual, historical, or interpretive material

      that would overload the inline illumination may be placed in a

      numbered footnote. A superscript numeral in the text points to

      the corresponding note at the bottom of the page.

    citation_rule: >

      Where a footnote makes a claim about the distribution, rarity,

      or use of a biblical word or expression, relevant biblical

      citations should be supplied.

  original_languages:

    old_testament:

      language: Hebrew

      script:

        use_hebrew_letters: true

        include_vowel_points: true

      textual_convention: >

        Use pointed Masoretic Hebrew for the displayed Hebrew form.

      pronunciation:

        standard: "Modern Israeli Hebrew"

        ipa: true

        rationale: >

          Modern Israeli Hebrew is used as the practical reader-facing

          pronunciation standard. It is a living Hebrew pronunciation

          used in contemporary Jewish life, including synagogue worship

          and biblical reading.

        historical_claim: false

        disclaimer: >

          The Modern Israeli pronunciation is not presented as a

          reconstruction of the pronunciation of biblical authors or

          of ancient Israel. Jewish communities also preserve Ashkenazi,

          Sephardi, Yemenite, and other pronunciation traditions.

    new_testament:

      language: Greek

      script:

        use_greek_letters: true

        include_diacritics: true

      pronunciation:

        standard: null

        ipa: true

        note: >

          A consistent pronunciation standard for New Testament Greek

          must be selected and documented before the prototype is

          finalized.

  interpretation:

    evidence_rule: >

      Distinguish observable linguistic facts from historical,

      theological, cosmological, or cultural interpretations derived

      from those facts.

    linguistic_fact:

      rule: >

        Features directly supported by the original-language text,

        morphology, grammar, or established lexical evidence may be

        presented as linguistic observations.

    interpretation:

      rule: >

        Broader conclusions suggested by those linguistic observations

        should be identified as interpretations or possibilities rather

        than stated as established linguistic facts.

  cosmological_hypotheses:

    rule: >

      Where features of the biblical text suggest a possible

      cosmological conception, the Illuminated Bible may identify

      and explore that conception as a hypothesis.

    evidence_standard: >

      The textual or linguistic evidence supporting the hypothesis

      must be identified separately from the interpretation derived

      from it.

    status_labels:

      - observation

      - possibility

      - hypothesis

      - competing_hypothesis

      - strongly_supported

      - unresolved

    cross_reference: true

    cumulative_analysis: >

      Cosmological hypotheses may draw evidence from multiple

      passages. Later passages may support, modify, compete with,

      or weaken hypotheses proposed earlier in the biblical text.

    hypotheses:

      sky_above_sky_below:

        name: "Sky Above / Sky Below"

        status: hypothesis

        first_reference: "Genesis 1:1"

        hypothesis: >

          The form shamayim may preserve or reflect a conception of

          the heavens as a pair: the sky above and the sky below.

        possible_model: >

          On a spherical Earth, "sky above" and "sky below" can be

          understood from the observer's perspective as the heavens

          extending around the Earth, rather than necessarily as two

          solid layers located above a flat Earth.

        caution: >

          The grammatical form of shamayim by itself does not establish

          this cosmological interpretation. The hypothesis is therefore

          presented as an interpretation prompted by the linguistic

          feature rather than as a meaning proved by the Hebrew word.

  prototype_word_choices:

    genesis_1_1:

      reference: "Genesis 1:1"

      illumination_choices:

        - english: "beginning"

          original_language_key: bereshit

          significance:

            - canonical

            - literary

            - title_or_book_name

          rationale: >

            Bereshit is the opening word of Genesis and the traditional

            Hebrew title of the book.

        - english: "God"

          original_language_key: elohim

          significance:

            - theological

            - divine_name

            - recurring_biblical_term

          rationale: >

            Elohim is a foundational Hebrew designation for God and an

            important recurring term throughout the Hebrew Bible.

        - english: "heaven"

          original_language_key: shamayim

          significance:

            - linguistic

            - grammatical

            - cosmological

            - worldview

          rationale: >

            Shamayim has a form historically associated with Hebrew

            dual morphology. Its morphology and usage make it a

            candidate for illumination because they may contribute

            to understanding biblical concepts of the heavens.

          interpretation_note: >

            The Sky Above / Sky Below interpretation is preserved as

            a cosmological hypothesis. The morphology of shamayim

            motivates investigation of the hypothesis but does not

            establish it.

        - english: "earth"

          original_language_key: eretz

          significance:

            - cosmological

            - worldview

            - paired_concept

          rationale: >

            Eretz forms the conceptual counterpart to shamayim in the

            expression "the heaven and the earth." Illuminating the

            two terms together may reveal information obscured by

            treating them simply as ordinary English nouns.

    genesis_1_2:

      reference: "Genesis 1:2"

      status: developing

      illumination_choices:

        - english: "earth"

          original_language_key: eretz

        - english: "formless and empty"

          original_language_key: tohu_va_bohu

        - english: "Darkness"

          original_language_key: choshekh

        - english: "the deep"

          original_language_key: tehom

        - english: "God's Spirit"

          original_language_key: ruach_elohim

        - english: "waters"

          original_language_key: mayim

      editorial_note: >

        All six illuminations survive the editorial-restraint test.

        Compound expressions such as "formless and empty" and

        "God's Spirit" are illuminated as units.

      planned_footnotes:

        - key: tohu_va_bohu_usage

          subject: "tohu va-bohu"

          note: >

            The footnote will discuss the unequal lexical evidence

            for tohu and bohu. Tohu is attested independently in

            additional biblical contexts and therefore has a broader

            independently observable semantic range. Bohu is

            exceptionally rare and is attested in Genesis 1:2,

            Isaiah 34:11, and Jeremiah 4:23 in association with tohu.

            The note should therefore avoid implying equal certainty

            in assigning separate English meanings to the two members

            of the Hebrew expression.

          citations:

            - "Genesis 1:2"

            - "Isaiah 34:11"

            - "Jeremiah 4:23"

  lexical_entries:

    hebrew:

      bereshit:

        english: "beginning"

        hebrew: "בְּרֵאשִׁית"

        transliteration: "bereshit"

        ipa: "/beʁeˈʃit/"

      elohim:

        english: "God"

        hebrew: "אֱלֹהִים"

        transliteration: "elohim"

        ipa: "/eloˈhim/"

      shamayim:

        english: "heaven"

        hebrew: "שָׁמַיִם"

        transliteration: "shamayim"

        ipa: "/ʃaˈmajim/"

        linguistic_note: >

          Shamayim has a form historically associated with Hebrew

          dual morphology.

        cosmological_hypotheses:

          - sky_above_sky_below

      eretz:

        english: "earth"

        hebrew: "אֶרֶץ"

        transliteration: "eretz"

        ipa: "/ˈeʁets/"

      tohu_va_bohu:

        english: "formless and empty"

        hebrew: "תֹהוּ וָבֹהוּ"

        transliteration: "tohu va-bohu"

        ipa: null

        lexical_note: >

          Tohu is independently attested elsewhere in the Hebrew

          Bible and has a broader observable semantic range. Bohu

          is exceptionally rare, making its independent meaning

          substantially more difficult to establish.

        footnote: tohu_va_bohu_usage

      choshekh:

        english: "darkness"

        hebrew: "חֹשֶׁךְ"

        transliteration: "choshekh"

        ipa: null

      tehom:

        english: "the deep"

        hebrew: "תְּהוֹם"

        transliteration: "tehom"

        ipa: null

      ruach_elohim:

        english: "God's Spirit"

        hebrew: "רוּחַ אֱלֹהִים"

        transliteration: "ruach Elohim"

        ipa: null

        lexical_note: >

          Ruach has a semantic range that includes spirit, wind,

          and breath. The translation choice therefore conceals a

          feature of the Hebrew expression worth illuminating.

      mayim:

        english: "waters"

        hebrew: "מַיִם"

        transliteration: "mayim"

        ipa: null

  text:

    genesis:

      chapter_1:

        - reference: "Genesis 1:1"

          source: BBE

          source_text: >

            In the beginning God made the heaven and the earth.

          illuminated:

            segments:

              - text: "In the "

              - text: "beginning"

                illumination: bereshit

              - text: " God"

                illumination: elohim

              - text: " made the "

              - text: "heaven"

                illumination: shamayim

              - text: " and the "

              - text: "earth"

                illumination: eretz

              - text: "."

          web_parallel: >

            In the beginning, God created the heavens and the earth.

        - reference: "Genesis 1:2"

          status: developing

illumination:

  principle: >

    Illuminate significant biblical words and phrases consistently

    throughout Scripture. The Illuminated Bible is not an interlinear;

    ordinary words are not illuminated merely because a Hebrew or Greek

    equivalent exists.

  categories:

    - divine_names

    - names_of_persons

    - sacred_and_significant_places

    - creation_and_created_things

    - humanity

    - spiritual_beings

    - covenant

    - worship

    - salvation

    - theological_terms

    - actions_of_god

    - legal_and_moral_terms

    - virtues

    - prophetic_and_messianic_terms

  phrase_rule: >

    When a significant biblical expression forms a meaningful lexical

    or grammatical unit, illuminate the complete English expression

    rather than isolated words within it.

  examples:

    - english: "God"

      category: divine_names

      illuminate: true

    - english: "God's Spirit"

      source: "ruach Elohim"

      category:

        - divine_names

        - spiritual_beings

        - theological_terms

      illuminate_as_phrase: true

    - english: "God created"

      category:

        - divine_names

        - actions_of_god

      illuminate_as_phrase: true

    - english: "God said"

      category:

        - divine_names

        - actions_of_god

      illuminate_as_phrase: true

  consistency_rule: >

    Once a biblical term or expression has been designated for

    illumination, equivalent occurrences should normally receive

    consistent treatment throughout the Bible.

  restraint_rule: >

    Do not illuminate every noun, verb, or source-language word.

    Illumination is selective and is governed by the defined

    categories and the significance of the expression in context.

footnote_policy:

  approved_material:

    rule: >

      No regressing: approved material carries forward unchanged.

  preservation:

    rule: >

      Approved footnotes remain full. They are not shortened,

      summarized, simplified, or removed in order to satisfy layout.

  pagination:

    rule: >

      Layout yields to approved content. If the full approved notes

      require additional pages, pagination expands rather than reducing

      or deleting content.

  interpretation:

    rule: >

      Distinguish original-language evidence from later interpretation.

      Interpretive proposals are explicitly identified as hypotheses.

  cross_references:

    rule: >

      Cross-references are parallels for consideration and are not

      presented automatically as proof of an interpretation.

genesis:

  chapter_1:

    foundation_map:

      1: BBE

      2: WEB

      3: WEB

      4: WEB

      5: WEB

      6: WEB

      7: WEB

      8: WEB

      9: WEB

      10: WEB

      11: WEB

      12: WEB

      13: WEB

      14: WEB

      15: WEB

      16: WEB

      17: WEB

      18: WEB

      19: BBE

      20: WEB

      21: WEB

      22: BBE

      23: BBE

      24: WEB

      25: BBE

      26: BBE

      27: BBE

      28: BBE

      29: BBE

      30: WEB

      31: BBE

    footnotes:

      - number: 1

        key: bara

        text: |

          Bara means "created." The verb itself does not specify creation

          from nothing, creatio ex nihilo. Whether Genesis teaches creation

          ex nihilo is a larger interpretive and theological question, not

          part of the lexical meaning of bara.

      - number: 2

        key: shamayim

        title: "shamayim - dual-skies hypothesis"

        text: |

          Shamayim has a form historically associated with the Hebrew dual.

          The Illuminated Bible proposes as a hypothesis that this may be

          understood as "dual skies": the sky above and the sky below,

          together comprising the celestial sphere, with the observer's

          horizon dividing the sphere into an upper and a lower hemisphere.

          This is an interpretive hypothesis, not a proposed translation of

          shamayim, and the grammatical form alone does not establish it.

          Genesis 1:8 is particularly significant because the text says that

          God calls the raqia shamayim. Cross-references: compare chug,

          "circle/circuit," in Isaiah 40:22 and Job 26:10, and the imagery of

          Job 26:7. These passages are offered as parallels for consideration,

          not as proof of the hypothesis.

      - number: 3

        key: ruach_elohim

        title: "ruach Elohim"

        text: |

          Ruach can mean "spirit," "wind," or "breath." Accordingly,

          ruach Elohim has a range of possible resonance broader than the

          English "God's Spirit." "Breath of God" reflects an important

          sense of ruach, though it is not necessarily the translation

          intended here.

      - number: 4

        key: yehi_or_vayehi_or

        title: "yehi or, vayehi or"

        text: |

          Yehi or, vayehi or is remarkably terse and poetic. The repeated

          or, "light," and the closely balanced verbal forms give the Hebrew

          a compactness difficult to reproduce in English. "Shine - and

          shine was" is not intended as a translation of the Hebrew, but

          only as an illustration of its concision, repetition, and poetic

          force.

      - number: 5

        key: yom_echad

        title: "yom echad"

        text: |

          Genesis 1:5 calls the first day yom echad, "one day" or "day one."

          Later numbered days use ordinal forms: compare yom sheni, "second

          day," in Genesis 1:8 and yom shelishi, "third day," in Genesis 1:13.

          The reason for the distinctive yom echad construction is uncertain.

      - number: 6

        key: raqia_and_shamayim

        title: "raqia and shamayim"

        text: |

          Genesis 1:8 says that God called the raqia shamayim. Yet Genesis

          1:14-17 subsequently uses the construction birqia hashamayim,

          "in the expanse of the heavens." Raqia and shamayim therefore

          overlap closely but should not automatically be treated as

          perfectly interchangeable synonyms. The illumination raises the

          question of what relationship Genesis intends between the named

          realm shamayim and the raqia associated with it; it does not

          provide an answer.

      - number: 7

        key: moadim

        title: "mo'adim"

        text: |

          The WEB renders mo'adim as "seasons." The Hebrew has a broader

          range that includes appointed times, appointed occasions, or

          fixed times. In Genesis 1:14 the heavenly lights are associated

          with signs, mo'adim, days, and years.

      - number: 8

        key: astronomical_context

        title: "astronomical context"

        text: |

          Genesis 1:14 belongs to an ancient Near Eastern world in which

          celestial observation was important for calendars, appointed

          times, omens, and religious practice. Babylonian and other

          Mesopotamian traditions gave great significance to celestial

          phenomena. Genesis likewise assigns the heavenly lights functions

          involving signs, appointed times, days, and years, while presenting

          them as created objects under Elohim rather than as independent

          deities. This comparison supplies historical context; it does not

          by itself establish literary dependence on a particular Babylonian

          text.

      - number: 9

        key: greater_and_lesser_light

        title: "greater and lesser light"

        text: |

          Biblical Hebrew has ordinary words for the sun, shemesh, and the

          moon, yareach. Genesis 1:16 does not use those names, instead

          describing them as the "greater light" and the "lesser light."

          The stars, by contrast, are called by the ordinary word kokhavim.

          The reason for this difference is interpretive. One hypothesis is

          that the wording contributes to Genesis's presentation of the sun

          and moon as created objects rather than deities. Compare

          Deuteronomy 4:19, which within the Torah explicitly names the sun,

          moon, and stars while warning against worshiping them. Compare also

          Psalm 136:7-9.

      - number: 10

        key: nefesh_chayah

        title: "nefesh chayah"

        text: |

          Nefesh chayah is commonly translated living creature or living

          being. Nefesh has a broader biblical range than creature suggests

          and may elsewhere be rendered being, life, person, or soul.

          Genesis 1:24 again uses nefesh chayah for land creatures;

          Genesis 2:7 applies the same expression to the human after God

          breathes into him the breath of life.

      - number: 11

        key: tanninim

        title: "tanninim"

        text: |

          Tanninim has a broader biblical range than sea creatures.

          Elsewhere tannin can designate great serpentine, dragon-like,

          or formidable creatures.

      - number: 12

        key: peru_urvu

        title: "peru urvu"

        text: |

          Peru comes from parah, to bear fruit. Urvu comes from ravah,

          to become many, increase, or multiply. The verbs complement one

          another: bear fruit; become many. Compare Genesis 1:28.

      - number: 13

        key: behemah_behemoth

        title: "behemah / Behemoth"

        text: |

          Behemah is broader than livestock. It is directly related to

          Behemoth in Job 40:15; English borrowed biblical Behemoth as

          behemoth, meaning something extraordinarily large, massive,

          formidable, or powerful.

      - number: 14

        key: let_us_make

        title: "Let us make / our image / our likeness"

        text: |

          The Hebrew plurals are real: na'aseh, let us make; betzalmenu,

          in our image; kidmutenu, according to our likeness. The grammar

          raises the question of whom the us includes. Verse 27 returns to

          singular language. Illumination raises the question without

          forcing an answer.

      - number: 15

        key: adam

        title: "adam"

        text: |

          Here adam can mean human or humankind. Compare Genesis 2:7,

          where ha-adam, the human, is formed from ha-adamah, the ground.

      - number: 16

        key: singular_and_plural_1_27

        title: "singular and plural in 1:27"

        text: |

          Verse 26 has let us make / our image / our likeness; verse 27

          returns to Elohim created / his image. Within verse 27, ha-adam

          is singular while male and female he created them ends in the

          plural.

      - number: 17

        key: kavash_and_radah

        title: "kavash and radah"

        text: |

          Kavash means to subdue, subject, or bring under control. Radah

          means to rule, govern, or exercise dominion over. Present the

          lexical strength before imposing modern interpretations.

      - number: 18

        key: tov_meod

        title: "tov me'od"

        text: |

          The repeated judgment tov, good, is intensified at the completion

          of the chapter to tov me'od, very good.

