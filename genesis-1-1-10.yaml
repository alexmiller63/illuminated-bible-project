footnotes:

  - number: 1

    term: "shamayim"

    note: >

      Shamayim is the Hebrew word rendered “heaven” here.

      Its form has traditionally invited discussion because of

      its apparent dual or plural morphology. The morphology

      should not be used to force a speculative interpretation

      into the English text.

  - number: 2

    term: "tohu va-vohu"

    note: >

      Tohu occurs elsewhere in Biblical Hebrew. Bohu is

      exceptionally rare, occurring in Genesis 1:2 and in

      passages that echo this language. The scarcity of bohu

      makes the precise force of the expression difficult to

      reproduce in English.

  - number: 3

    term: "yehi or — vayehi or"

    note: >

      Or means “light.” The Hebrew is extraordinarily concise.

      “Let there be light — and there was light” should be

      treated as a single illuminated phrase. Its repetition

      gives the Hebrew a poetic compression suggestive of

      “shine — and shine was,” without proposing that wording

      as a biblical translation.

  - number: 4

    term: "tov"

    note: >

      Tov can carry the senses good, pleasing, fitting, or

      beneficial. The simple English “good” preserves that

      breadth without over-interpreting it.

  - number: 5

    term: "erev … boqer"

    note: >

      The recurring evening-and-morning formula gives the

      creation account part of its characteristic cadence.

  - number: 6

    term: "raqia"

    note: >

      Raqia is variously rendered “expanse,” “firmament,”

      or “vault.” Each English rendering carries interpretive

      implications that the Hebrew illumination allows the

      reader to see without forcing a single interpretation.

  - number: 7

    term: "shamayim"

    note: >

      Shamayim appears again here. Repeated Hebrew terms are

      illuminated selectively when the repetition itself helps

      the reader perceive the structure of the passage.

  - number: 8

    term: "eretz … yamim"

    note: >

      The naming of earth and seas continues the chapter’s

      pattern of separation, ordering, and naming.

