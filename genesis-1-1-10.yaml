# Bible.yml

#

# The Illuminated Bible

# Canonical editorial and presentation rules

#

# Verse text belongs in book/passage source files such as:

#   genesis-1-1-10.yaml

# Approved readable editions may also be preserved as Markdown:

#   genesis-1-1-10.md

project:

  name: "The Illuminated Bible"

  motto: "Restrained Art. Eternal Truth."

  author: "Alexander Ferrari Miller"

publication:

  format: "collection_of_books"

  principle: >

    The Illuminated Bible is published as a collection of individual

    biblical books rather than as one single-volume Bible.

  series_identity:

    display_name: "The Illuminated Bible"

    placement:

      cover: true

      spine: true

book_titles:

  hierarchy:

    primary: hebrew

    secondary: greek

    english_title_display: false

  hebrew:

    vocalization: unvocalized

    size_relative_to_greek: larger

    alignment: centered

  greek:

    alignment: centered

    position: below_hebrew

text_layout:

  columns: 2

  column_headings: false

  left_column:

    content: illuminated_text

  right_column:

    content: WEB

    name: "World English Bible"

  row_alignment:

    enabled: true

    rule: >

      Each verse forms one horizontal row across both columns.

      The illuminated verse and the corresponding WEB verse begin

      at the same vertical position. Row height is determined by

      whichever side requires more vertical space.

verse_source:

  scope: per_verse

  allowed_sources:

    - abbreviation: BEB

      name: "Basic English Bible"

    - abbreviation: WEB

      name: "World English Bible"

  display:

    show_source: true

    position: after_verse_number

    brackets: false

  example: "1 BEB"

illumination:

  structure: inline

  principle: >

    The complete English foundation verse remains readable as continuous

    prose. Selected English words or phrases are expanded inline with

    original-language information. Illumination must never replace the

    verse with a glossary or interlinear display.

  order:

    - english

    - original_script

    - transliteration

    - ipa

  separator: " — "

  repeat_policy:

    rule: >

      If a word or phrase merits illumination, illuminate it again when

      it recurs. Each verse must be capable of serving as the reader's

      first encounter with The Illuminated Bible.

  density:

    general_rule: >

      Exercise restraint, but let the density of illumination be governed

      by the linguistic and poetic character of the passage rather than

      by an arbitrary limit.

    genesis_1:

      density: relatively_dense

      reason: >

        Genesis 1 is highly compressed, repetitive, structured, and poetic.

        Dense illumination is appropriate where it reveals that structure.

hebrew:

  inline_illumination:

    vocalization: fully_vocalized

    system: masoretic

    niqqud: true

  titles:

    vocalization: unvocalized

    niqqud: false

  pronunciation:

    convention: modern_israeli

  typography:

    preferred_face: "Noto Serif Hebrew"

transliteration:

  purpose: >

    Transliteration provides a natural readable form of Hebrew or Greek

    terms for readers who do not read the original script.

  footnote_usage:

    rule: >

      Once an original-language term has been introduced in the illumination,

      footnotes normally refer to it by transliteration rather than repeatedly

      reproducing the original script.

ipa:

  enabled: true

  purpose: >

    IPA records pronunciation separately from transliteration.

footnotes:

  style: numbered

  placement: bottom

  use_only_when_necessary: true

  purpose:

    - lexical_range

    - unusual_grammar

    - ambiguity

    - poetic_effect

    - textual_structure

    - interpretive_hypothesis

    - cross_reference

  principle: >

    Footnotes are used for information that cannot fit naturally inside

    the illuminated verse without disrupting readability.

interpretation:

  governing_principle: >

    Distinguish what the original-language text says from later

    interpretations, doctrines, and debates. Illuminate the language first;

    allow interpretation to follow.

  hypotheses:

    labeling_required: true

    rule: >

      Interpretive proposals originating with The Illuminated Bible must be

      explicitly identified as hypotheses and must not be presented as lexical

      facts or as required translations.

  cross_references:

    allowed: true

    rule: >

      Cross-reference related passages as evidence or parallels for

      consideration. Do not present cross-references as proof unless the

      original-language evidence itself warrants that conclusion.

genesis_specific_rules:

  recurring_illuminations:

    God:

      always_illuminate: true

      hebrew: "אֱלֹהִים"

      transliteration: "Elohim"

      exception: >

        When God occurs inside a larger illuminated phrase, such as

        "God's Spirit" / "ruach Elohim", illuminate the larger phrase as

        a single unit.

    light:

      illuminate_all_relevant_occurrences: true

    darkness:

      illuminate_all_relevant_occurrences: true

    day:

      illuminate_all_relevant_occurrences: true

    night:

      illuminate_all_relevant_occurrences: true

    waters:

      illuminate_all_relevant_occurrences: true

    expanse:

      illuminate_all_relevant_occurrences: true

  genesis_1_1:

    illuminate:

      - "In the beginning"

      - "God"

      - "created"

      - "the heaven and the earth"

    title_connection:

      phrase: "In the beginning"

      hebrew_title: "Bereshit"

  genesis_1_2:

    illuminate_as_single_phrase:

      - "God's Spirit"

  genesis_1_3:

    illuminate_as_single_phrase:

      - "Let there be light, and there was light"

    footnote_rule: >

      Explain the remarkable terseness and poetic repetition of

      "yehi or, vayehi or". "Shine—and shine was" may be used only as an

      illustration of the poetry and must be explicitly identified as

      not being a translation.

  genesis_1_5:

    illuminate:

      - "the first day"

    note:

      transliteration: "yom echad"

      explanation: >

        The Hebrew is closer to "one day" or "day one" than to the ordinary

        Hebrew ordinal "first."

  genesis_1_6_to_8:

    raqia:

      illuminate: true

      note: >

        Raqia is the expanse separating waters below from waters above.

        Genesis 1:8 states that God calls the raqia shamayim.

        The precise physical conception represented by raqia is debated.

  shamayim:

    dual_skies_hypothesis:

      status: hypothesis

      statement: >

        The Illuminated Bible proposes that the historically dual-shaped

        form shamayim may resonate with "dual skies": the sky above and the

        sky below, together comprising the celestial sphere, with the

        observer's horizon dividing that sphere into an upper and a lower

        hemisphere.

      caution: >

        This is an interpretive hypothesis, not a proposed translation of

        shamayim, and the grammatical form alone does not establish it.

      cross_references:

        - reference: "Isaiah 40:22"

          term: "chug"

        - reference: "Job 26:10"

          term: "chug"

        - reference: "Job 26:7"

          term: null

      cross_reference_note: >

        These passages are parallels for consideration, not proof of the

        dual-skies hypothesis.

art:

  philosophy: restrained

  principle: >

    Artwork should illuminate the biblical book rather than merely decorate

    it. The text remains primary.

  genesis:

    subjects:

      - creation

      - light_and_darkness

      - expanse

      - waters_above_and_below

      - earth_and_seas

      - garden_of_eden

      - Adam_and_Eve

typography:

  principle: >

    Typography is an intentional part of the design rather than a technical

    fallback.

  english_scripture:

    category: book_serif

  hebrew:

    category: hebrew_serif

    preferred_face: "Noto Serif Hebrew"

  greek:

    category: classical_serif

  transliteration:

    category: italic_serif

  ipa:

    category: readable_sans_serif

canonical_sources:

  structured:

    - "genesis-1-1-10.yaml"

  readable:

    - "genesis-1-1-10.md"

  rule: >

    Mock-ups, PDFs, and artwork must be generated from canonical source files.

    They must not silently alter approved text, illumination decisions,

    footnotes, or editorial rules.

revision_policy:

  mode: incremental

  rule: >

    Once content or design decisions are approved, later revisions change

    only explicitly requested elements. Unrequested material carries forward

    unchanged.

  shorthand: "No regressing."

# ============================================================

# APPEND TO Bible.yml

# Genesis 1:11–18 — approved illumination decisions

# ============================================================

editorial_extensions:

  illumination_inquiry:

    principle: >

      Illumination may raise questions the text itself does not answer.

    rule: >

      When linguistic, grammatical, historical, or literary features raise

      a significant question, The Illuminated Bible may explicitly identify

      that question. Such questions must be presented as hypotheses or

      inquiries, not as conclusions established by the text.

    authorship_neutrality: >

      Historical or linguistic hypotheses should not require the reader to

      adopt a particular theory of biblical authorship. Evidence from the

      text is presented first; competing interpretations may then be

      considered.

  historical_context:

    rule: >

      Ancient Near Eastern historical context may be supplied when it helps

      illuminate language, imagery, or literary choices. Historical context

      must remain distinct from lexical meaning and must not be presented as

      proof of literary dependence unless the evidence warrants it.

genesis_specific_rules:

  genesis_1_1_addendum:

    elohim_bara_inquiry:

      status: open_question

      observation: >

        Elohim is morphologically plural in form, while bara, "created,"

        is grammatically singular. In the received Hebrew text, Elohim

        therefore functions here as a singular actor.

      inquiry: >

        Illuminating the plural form Elohim beside the singular verb bara

        raises a historical question: what, if anything, might this

        combination tell us about the linguistic or religious history

        behind the received Hebrew text?

      limitation: >

        The grammatical evidence does not establish an earlier reading

        meaning "gods created," nor does it by itself reconstruct an

        earlier oral tradition.

      principle: >

        The illumination raises the question; it does not provide an answer.

  genesis_1_5_addendum:

    yom_echad:

      observation: >

        Genesis 1:5 uses yom echad, literally "one day" or "day one,"

        rather than an ordinary ordinal expression meaning "first day."

      contrast:

        - reference: "Genesis 1:8"

          form: "yom sheni"

          meaning: "second day"

        - reference: "Genesis 1:13"

          form: "yom shelishi"

          meaning: "third day"

      note: >

        Unlike the subsequent numbered days, which use ordinal numbers,

        the first is called yom echad, "one day." The reason for this

        distinctive construction is uncertain.

  genesis_1_11:

    illumination:

      density: dense

      terms:

        - english: "God"

          transliteration: "Elohim"

        - english: "earth"

          transliteration: "eretz"

        - english: "grass / vegetation"

        - english: "herbs yielding seed"

        - english: "seed"

        - english: "fruit trees"

        - english: "fruit"

        - english: "after their kind"

    recurring_phrase:

      english: "after their kind"

      rule: >

        Establish the Hebrew expression here and illuminate it consistently

        when it recurs in the creation account.

  genesis_1_12:

    principle: >

      Preserve the deliberate lexical repetition between verses 11 and 12.

    illumination:

      - "earth"

      - "grass / vegetation"

      - "herbs yielding seed"

      - "seed"

      - "after their kind"

      - "trees bearing fruit"

      - "fruit"

      - "God"

      - "it was good"

    recurring_refrain:

      english: "it was good"

      transliteration: "ki tov"

  genesis_1_13:

    illumination:

      - english: "evening"

        transliteration: "erev"

      - english: "morning"

        transliteration: "boqer"

      - english: "a third day"

        transliteration: "yom shelishi"

    cross_reference:

      target: "Genesis 1:5"

      purpose: >

        Make visible the contrast between yom echad, "one day," and the

        later ordinal forms.

  genesis_1_14:

    illumination:

      density: dense

      terms:

        - english: "God"

          transliteration: "Elohim"

        - english: "lights"

          transliteration: "me'orot"

        - english: "expanse"

          transliteration: "raqia"

        - english: "sky / heavens"

          transliteration: "shamayim"

        - english: "day"

          transliteration: "yom"

        - english: "night"

          transliteration: "layla"

        - english: "signs"

        - english: "seasons / appointed times"

          transliteration: "mo'adim"

        - english: "days"

        - english: "years"

    moadim_note:

      type: lexical

      statement: >

        Mo'adim has a semantic range including appointed times,

        appointed occasions, or fixed times. The WEB translation

        "seasons" should remain in the foundation text, while the

        illumination and footnote expose the broader Hebrew range.

    astronomical_context:

      type: historical_context

      statement: >

        Genesis 1:14 belongs to an ancient Near Eastern cultural world in

        which observation of celestial phenomena was important for calendars,

        appointed times, omens, and religious practice.

      contrast: >

        Genesis assigns the heavenly lights functions involving signs,

        appointed times, days, and years while presenting those lights as

        created objects under Elohim rather than as independent deities.

      caution: >

        This historical comparison does not by itself establish that Genesis

        borrowed from any particular Babylonian text.

      related_tradition:

        - "Mesopotamian astral traditions"

        - "Babylonian astronomical and astrological traditions"

        - "Enuma Elish"

    astronomy_editorial_note: >

      The Illuminated Bible may give particular attention to astronomical

      vocabulary where the biblical text engages the celestial concepts of

      its ancient cultural environment.

  genesis_1_15:

    illumination:

      - english: "lights"

        transliteration: "me'orot"

      - english: "expanse"

        transliteration: "raqia"

      - english: "sky / heavens"

        transliteration: "shamayim"

      - english: "give light"

      - english: "earth"

        transliteration: "eretz"

    poetic_observation: >

      Illuminate both "lights" and "give light" so that the reader can see

      and hear the Hebrew relationship between the noun and the associated

      verbal expression.

  genesis_1_16:

    illumination:

      density: dense

      terms:

        - english: "God"

          transliteration: "Elohim"

        - english: "two great lights"

        - english: "greater light"

        - english: "rule the day"

        - english: "lesser light"

        - english: "rule the night"

        - english: "stars"

          transliteration: "kokhavim"

    naming_observation:

      type: lexical_literary

      statement: >

        Biblical Hebrew possesses ordinary words for the sun and moon:

        shemesh and yareach. Genesis 1:16 does not use those names.

        Instead it describes them as the greater light and the lesser light.

        The stars, by contrast, are called by the ordinary word kokhavim.

    interpretation:

      status: hypothesis

      statement: >

        The avoidance of the ordinary names for sun and moon may be

        significant in the ancient Near Eastern religious context and may

        contribute to the presentation of these celestial bodies as created

        objects rather than divine beings.

      caution: >

        The lexical fact is the naming difference. The reason for that

        difference remains interpretive.

    cross_references:

      - reference: "Deuteronomy 4:19"

        importance: primary

        note: >

          Within the Torah, Deuteronomy explicitly names the sun, moon,

          and stars while warning against worshiping them. Compare its use

          of shemesh, yareach, and kokhavim with the wording of Genesis 1:16.

      - reference: "Psalm 136:7-9"

        importance: secondary

        note: >

          Compare the later biblical description of the great lights,

          the sun governing the day, and the moon and stars governing

          the night.

    concordance_rule: >

      Where useful, cross-reference ordinary occurrences of shemesh and

      yareach separately from occurrences of the "greater light" and

      "lesser light" terminology so readers can evaluate the distinctiveness

      of Genesis 1:16 for themselves.

  genesis_1_17:

    foundation: WEB

    illumination:

      - english: "God"

        transliteration: "Elohim"

      - english: "set them"

      - english: "expanse"

        transliteration: "raqia"

      - english: "sky / heavens"

        transliteration: "shamayim"

      - english: "give light"

      - english: "earth"

        transliteration: "eretz"

    raqia_shamayim_note:

      type: lexical_literary

      observation: >

        Genesis 1:8 says that God called the raqia shamayim. Yet Genesis

        1:14, 1:15, and 1:17 subsequently use the fuller construction

        birqia hashamayim, "in the expanse of the heavens."

      implication: >

        Raqia and shamayim therefore overlap closely in Genesis 1 but should

        not automatically be treated as perfectly interchangeable lexical

        synonyms.

      inquiry: >

        What relationship does Genesis intend between the named realm

        shamayim and the raqia associated with it?

      status: open_question

      dual_skies_connection: >

        This distinction may be considered alongside the Illuminated Bible's

        dual-skies hypothesis, but it does not by itself prove that

        hypothesis.

  genesis_1_18:

    illumination:

      principle: >

        Preserve the repeated creation vocabulary and illuminate the language

        of governing or ruling without implying divinity.

      terms:

        - english: "rule"

        - english: "day"

          transliteration: "yom"

        - english: "night"

          transliteration: "layla"

        - english: "divide"

        - english: "light"

          transliteration: "or"

        - english: "darkness"

          transliteration: "choshekh"

        - english: "God"

          transliteration: "Elohim"

        - english: "it was good"

          transliteration: "ki tov"

    rule_note:

      statement: >

        The language of "rule" describes the assigned governing function

        of the celestial lights over day and night. Illumination should not

        imply that the lights themselves possess divine status.

# ============================================================

# DESIGN RULES APPROVED DURING GENESIS 1:11–18

# ============================================================

design_extensions:

  verse_table:

    borders: invisible

    rule: >

      The verse rows and columns remain structurally aligned, but all table

      borders and ruler lines are invisible in the finished edition.

      Typography and spacing, not visible rules, reveal the structure.

  spine:

    book_title:

      hebrew:

        position: above_greek

        alignment: centered

      greek:

        position: below_hebrew

        alignment: centered

    series_mark:

      full_name: "The Illuminated Bible"

      monogram: "IB"

      phonetic_name: "India Bravo"

      narrow_spine_rule: >

        When "The Illuminated Bible" cannot be set comfortably on the spine,

        use the IB monogram as the series mark.

  title_page:

    subtitle_display: false

    rule: >

      Display only the unvocalized Hebrew book title centered above the

      Greek book title. Do not place "Restrained Art. Eternal Truth."

      beneath the Greek title.

