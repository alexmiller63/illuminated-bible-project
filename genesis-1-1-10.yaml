footnotes:

  - number: 1

    term: "tohu va-vohu"

    note: >

      Tohu occurs elsewhere in Biblical Hebrew. Bohu is

      exceptionally rare. Its scarcity is one reason the phrase

      resists a simple one-to-one English equivalent.

  - number: 2

    term: "yehi or — vayehi or"

    note: >

      Or means “light.” “Let there be light — and there was light”

      is treated as one illuminated phrase because the Hebrew

      command and fulfillment form a strikingly compressed poetic unit.

  - number: 3

    term: "tov"

    note: >

      Tov can carry senses including good, pleasing, fitting,

      or beneficial. The English “good” preserves that breadth.

  - number: 4

    term: "erev … boqer"

    note: >

      The evening-and-morning formula contributes to the recurring

      cadence and structure of the creation account.

  - number: 5

    term: "raqia"

    note: >

      Raqia is variously rendered “expanse,” “firmament,” or “vault.”

      The Hebrew illumination lets the reader see the term without

      forcing one English interpretation.

  - number: 6

    term: "shamayim"

    note: >

      Shamayim appears again here. Repeated Hebrew terms may be

      illuminated when the repetition itself helps reveal the structure

      of the passage.

  - number: 7

    term: "eretz … yamim"

    note: >

      The naming of earth and seas continues the chapter’s pattern

      of separation, ordering, and naming.

