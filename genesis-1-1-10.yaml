# genesis-1-1-10.yaml

#

# CANONICAL WORKING TEXT

# Bereshit / Γένεσις 1:1–10

#

# Approved after verse-by-verse editorial review.

#

# PAGE ARCHITECTURE

# - Two unlabeled columns

# - Left: illuminated text

# - Right: WEB comparison text

# - English foundation is selected verse by verse

# - Foundation abbreviation follows the verse number without brackets

#

# INLINE ILLUMINATION ORDER

# English → Hebrew → Transliteration → IPA

#

# Hebrew is displayed without vowel points.

# Pronunciation convention: Modern Israeli.

#

# EDITORIAL PRINCIPLE

# Each verse must be capable of being the reader's first encounter

# with the Illuminated Bible. A term that deserves illumination is

# therefore illuminated again when it recurs.

