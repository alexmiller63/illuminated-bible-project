    - english

    - hebrew

    - transliteration

    - ipa

  hebrew_points: false

  pronunciation: modern_israeli

  editorial_rules:

    - "Each verse stands independently."

    - "Repeat an illumination when an illuminated term recurs."

    - "Density is determined by the language and poetry of the passage."

    - "Genesis 1 may appropriately receive relatively dense illumination."

    - "God is illuminated wherever it occurs, except when it forms part of a larger illuminated phrase such as God's Spirit."

