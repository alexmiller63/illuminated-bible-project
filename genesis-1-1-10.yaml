# Bible.yml

#

# The Illuminated Bible

# Canonical editorial and presentation rules

#

# Verse text belongs in book/passage source files such as:

#   genesis-1-1-10.yaml

# Approved readable editions may also be preserved as Markdown:

#   genesis-1-1-10.md

project:

  name: "The Illuminated Bible"

  motto: "Restrained Art. Eternal Truth."

  author: "Alexander Ferrari Miller"

publication:

  format: "collection_of_books"

  principle: >

    The Illuminated Bible is published as a collection of individual

    biblical books rather than as one single-volume Bible.

  series_identity:

    display_name: "The Illuminated Bible"

    placement:

      cover: true

      spine: true

book_titles:

  hierarchy:

    primary: hebrew

    secondary: greek

    english_title_display: false

  hebrew:

    vocalization: unvocalized

    size_relative_to_greek: larger

    alignment: centered

  greek:

    alignment: centered

    position: below_hebrew

text_layout:

  columns: 2

  column_headings: false

  left_column:

    content: illuminated_text

  right_column:

    content: WEB

    name: "World English Bible"

  row_alignment:

    enabled: true

    rule: >

      Each verse forms one horizontal row across both columns.

      The illuminated verse and the corresponding WEB verse begin

      at the same vertical position. Row height is determined by

      whichever side requires more vertical space.

verse_source:

  scope: per_verse

  allowed_sources:

    - abbreviation: BEB

      name: "Basic English Bible"

    - abbreviation: WEB

      name: "World English Bible"

  display:

    show_source: true

    position: after_verse_number

    brackets: false

  example: "1 BEB"

illumination:

  structure: inline

  principle: >

    The complete English foundation verse remains readable as continuous

    prose. Selected English words or phrases are expanded inline with

    original-language information. Illumination must never replace the

    verse with a glossary or interlinear display.

  order:

    - english

    - original_script

    - transliteration

    - ipa

  separator: " — "

  repeat_policy:

    rule: >

      If a word or phrase merits illumination, illuminate it again when

      it recurs. Each verse must be capable of serving as the reader's

      first encounter with The Illuminated Bible.

  density:

    general_rule: >

      Exercise restraint, but let the density of illumination be governed

      by the linguistic and poetic character of the passage rather than

      by an arbitrary limit.

    genesis_1:

      density: relatively_dense

      reason: >

        Genesis 1 is highly compressed, repetitive, structured, and poetic.

        Dense illumination is appropriate where it reveals that structure.

hebrew:

  inline_illumination:

    vocalization: fully_vocalized

    system: masoretic

    niqqud: true

  titles:

    vocalization: unvocalized

    niqqud: false

  pronunciation:

    convention: modern_israeli

  typography:

    preferred_face: "Noto Serif Hebrew"

transliteration:

  purpose: >

    Transliteration provides a natural readable form of Hebrew or Greek

    terms for readers who do not read the original script.

  footnote_usage:

    rule: >

      Once an original-language term has been introduced in the illumination,

      footnotes normally refer to it by transliteration rather than repeatedly

      reproducing the original script.

ipa:

  enabled: true

  purpose: >

    IPA records pronunciation separately from transliteration.

footnotes:

  style: numbered

  placement: bottom

  use_only_when_necessary: true

  purpose:

    - lexical_range

    - unusual_grammar

    - ambiguity

    - poetic_effect

    - textual_structure

    - interpretive_hypothesis

    - cross_reference

  principle: >

    Footnotes are used for information that cannot fit naturally inside

    the illuminated verse without disrupting readability.

interpretation:

  governing_principle: >

    Distinguish what the original-language text says from later

    interpretations, doctrines, and debates. Illuminate the language first;

    allow interpretation to follow.

  hypotheses:

    labeling_required: true

    rule: >

      Interpretive proposals originating with The Illuminated Bible must be

      explicitly identified as hypotheses and must not be presented as lexical

      facts or as required translations.

  cross_references:

    allowed: true

    rule: >

      Cross-reference related passages as evidence or parallels for

      consideration. Do not present cross-references as proof unless the

      original-language evidence itself warrants that conclusion.

genesis_specific_rules:

  recurring_illuminations:

    God:

      always_illuminate: true

      hebrew: "אֱלֹהִים"

      transliteration: "Elohim"

      exception: >

        When God occurs inside a larger illuminated phrase, such as

        "God's Spirit" / "ruach Elohim", illuminate the larger phrase as

        a single unit.

    light:

      illuminate_all_relevant_occurrences: true

    darkness:

      illuminate_all_relevant_occurrences: true

    day:

      illuminate_all_relevant_occurrences: true

    night:

      illuminate_all_relevant_occurrences: true

    waters:

      illuminate_all_relevant_occurrences: true

    expanse:

      illuminate_all_relevant_occurrences: true

  genesis_1_1:

    illuminate:

      - "In the beginning"

      - "God"

      - "created"

      - "the heaven and the earth"

    title_connection:

      phrase: "In the beginning"

      hebrew_title: "Bereshit"

  genesis_1_2:

    illuminate_as_single_phrase:

      - "God's Spirit"

  genesis_1_3:

    illuminate_as_single_phrase:

      - "Let there be light, and there was light"

    footnote_rule: >

      Explain the remarkable terseness and poetic repetition of

      "yehi or, vayehi or". "Shine—and shine was" may be used only as an

      illustration of the poetry and must be explicitly identified as

      not being a translation.

  genesis_1_5:

    illuminate:

      - "the first day"

    note:

      transliteration: "yom echad"

      explanation: >

        The Hebrew is closer to "one day" or "day one" than to the ordinary

        Hebrew ordinal "first."

  genesis_1_6_to_8:

    raqia:

      illuminate: true

      note: >

        Raqia is the expanse separating waters below from waters above.

        Genesis 1:8 states that God calls the raqia shamayim.

        The precise physical conception represented by raqia is debated.

  shamayim:

    dual_skies_hypothesis:

      status: hypothesis

      statement: >

        The Illuminated Bible proposes that the historically dual-shaped

        form shamayim may resonate with "dual skies": the sky above and the

        sky below, together comprising the celestial sphere, with the

        observer's horizon dividing that sphere into an upper and a lower

        hemisphere.

      caution: >

        This is an interpretive hypothesis, not a proposed translation of

        shamayim, and the grammatical form alone does not establish it.

      cross_references:

        - reference: "Isaiah 40:22"

          term: "chug"

        - reference: "Job 26:10"

          term: "chug"

        - reference: "Job 26:7"

          term: null

      cross_reference_note: >

        These passages are parallels for consideration, not proof of the

        dual-skies hypothesis.

art:

  philosophy: restrained

  principle: >

    Artwork should illuminate the biblical book rather than merely decorate

    it. The text remains primary.

  genesis:

    subjects:

      - creation

      - light_and_darkness

      - expanse

      - waters_above_and_below

      - earth_and_seas

      - garden_of_eden

      - Adam_and_Eve

typography:

  principle: >

    Typography is an intentional part of the design rather than a technical

    fallback.

  english_scripture:

    category: book_serif

  hebrew:

    category: hebrew_serif

    preferred_face: "Noto Serif Hebrew"

  greek:

    category: classical_serif

  transliteration:

    category: italic_serif

  ipa:

    category: readable_sans_serif

canonical_sources:

  structured:

    - "genesis-1-1-10.yaml"

  readable:

    - "genesis-1-1-10.md"

  rule: >

    Mock-ups, PDFs, and artwork must be generated from canonical source files.

    They must not silently alter approved text, illumination decisions,

    footnotes, or editorial rules.

revision_policy:

  mode: incremental

  rule: >

    Once content or design decisions are approved, later revisions change

    only explicitly requested elements. Unrequested material carries forward

    unchanged.

  shorthand: "No regressing."

