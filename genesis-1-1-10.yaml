footnotes:

  - number: 1

    verse: 1

    term: "bara"

    note: >

      Bara means “created.” The verb itself does not specify

      creation from nothing. Creation ex nihilo—“creation out

      of nothing”—is a larger interpretive and theological

      question, not part of the lexical meaning of bara.

  - number: 2

    verse: 3

    term: "yehi or, vayehi or"

    note: >

      The Hebrew is remarkably terse and poetic. Its compression

      might be suggested by “shine—and shine was.” This is not

      offered as a translation, but as an illustration of the

      poetic force of the Hebrew.

  - number: 3

    verse: 5

    term: "yom echad"

    note: >

      Yom echad is literally closer to “one day” or “day one”

      than to the ordinary Hebrew ordinal “first.”

  - number: 4

    verse: 6

    term: "raqia"

    note: >

      Raqia is the expanse separating the waters below from the

      waters above. Genesis 1:8 says that God calls the raqia

      shamayim, “sky” or “heavens.” The precise physical

      conception represented by the term is debated.

