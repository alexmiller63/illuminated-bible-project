# ============================================================

# genesis-chapter-1.yaml

#

# THE ILLUMINATED BIBLE

# Genesis Chapter 1

#

# Canonical chapter source

# ============================================================

book: Genesis

chapter: 1

project:

  name: "The Illuminated Bible"

  motto: "Restrained Art. Eternal Truth."

  author: "Alexander Ferrari Miller"

# ============================================================

# CHAPTER PRESENTATION

# ============================================================

presentation:

  scripture_font_size: 14

  large_print:

    enabled: true

    rule: >

      Scripture must be rendered as genuine large print at 14 points.

      Scripture type must never be reduced merely to make additional

      verses fit on a page. The chapter must use as many pages as

      necessary to preserve the approved 14-point scripture size.

  source_label:

    enabled: true

    display:

      Basic English: BBE

      WEB: WEB

    size_points: 6

    position: inline_after_verse_number

    line_break_after: false

    rule: >

      In the illuminated left column, the verse number is followed

      immediately by the source label BBE or WEB in 6-point type.

      The verse text follows immediately on the same line. There must

      be no line break separating the source label from the verse text.

      The full name "Basic English" must not be printed as the source

      label in the scripture column.

  columns:

    illuminated:

      position: left

      english_weight: bold

    comparison:

      position: right

      source: WEB

      english_weight: regular

    footnotes:

      position: far_right

      independent_flow: true

  verse_alignment:

    enabled: true

    rule: >

      The illuminated verse and corresponding WEB verse must begin

      at exactly the same vertical position. Each verse has one shared

      row-top coordinate. The height of the scripture row is determined

      by whichever scripture column requires more vertical space.

  footnote_flow:

    rule: >

      Footnotes flow independently of scripture verse rows. A long

      footnote must not increase the height of its corresponding verse

      row or force later scripture verses downward. Footnotes may

      continue onto subsequent pages.

    preserve_complete_text: true

    prohibition: >

      Approved footnotes must never be shortened, summarized,

      paraphrased, weakened, or deleted merely to make a page fit.

    labeling:

      heading: null

      prohibit_status_labels: true

      rule: >

        Footnotes appear in the far-right footnote column without

        editorial status labels such as "NEW".

  hebrew:

    direction: rtl

    vocalization: fully_vocalized

    system: masoretic

    niqqud: true

    typography:

      category: hebrew_serif

      preferred_face: "Noto Serif Hebrew"

  transliteration:

    style: italic_serif

  ipa:

    style: readable_sans_serif

  table_borders:

    visible: false

  layout_integrity:

    rule: >

      Layout must yield to approved content, never the reverse.

      Approved illumination and footnotes must not be abbreviated,

      paraphrased, deleted, or rendered in smaller type merely to make

      material fit. Genesis 1:1-31 must be presented in full, using as

      many pages as necessary.

