# HISTORICAL / LITERARY NOTES

# ============================================================

historical_context:

  genesis_1_14:

    statement: >

      Genesis 1:14 belongs to an ancient Near Eastern cultural world

      in which observation of celestial phenomena was important for

      calendars, appointed times, omens, and religious practice.

    contrast: >

      Genesis assigns the heavenly lights functions involving signs,

      appointed times, days, and years while presenting those lights

      as created objects under Elohim rather than as independent

      deities.

    caution: >

      This historical comparison does not by itself establish that

      Genesis borrowed from any particular Babylonian text.

    related_tradition:

      - "Mesopotamian astral traditions"

      - "Babylonian astronomical and astrological traditions"

      - "Enuma Elish"

