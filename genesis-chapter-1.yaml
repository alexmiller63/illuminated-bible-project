  genesis_1_3:

    illuminate_as_single_phrase:

      - "Let there be light, and there was light"

  genesis_1_11_12:

    rule: >

      Preserve the deliberate lexical repetition between verses

      11 and 12.

  genesis_1_15:

    rule: >

      Illuminate both "lights" and "give light" so the reader can

      see and hear the Hebrew relationship between the noun and

      associated verbal expression.

  genesis_1_18:

    rule: >

      Preserve the repeated creation vocabulary and illuminate the

      language of governing or ruling without implying divinity.

# ============================================================

# ART / TYPOGRAPHY

# ============================================================

art:

  philosophy: restrained

  principle: >

    Artwork should illuminate the biblical book rather than merely

    decorate it. The text remains primary.

  subjects:

    - creation

    - light_and_darkness

    - expanse

    - waters_above_and_below

    - earth_and_seas

    - garden_of_eden

    - Adam_and_Eve

typography:

  principle: >

    Typography is an intentional part of the design rather than a

    technical fallback.

  illuminated_english:

    category: book_serif

    weight: bold

    size_points: 14

  comparison_english:

    category: book_serif

    weight: regular

    size_points: 14

  source_label:

    category: book_serif

    size_points: 6

    position: inline_after_verse_number

    line_break_after: false

  hebrew:

    category: hebrew_serif

    preferred_face: "Noto Serif Hebrew"

    direction: rtl

  greek:

    category: classical_serif

  transliteration:

    category: italic_serif

  ipa:

    category: readable_sans_serif

# ============================================================

# REVISION POLICY

# ============================================================

revision_policy:

  mode: incremental

  rule: >

    Once content or design decisions are approved, later revisions

    change only explicitly requested elements. Unrequested material

    carries forward unchanged.

  shorthand: "No regressing."

# ============================================================

# EDITORIAL AMENDMENT

#

# Logical location:

# editorial_rules -> cross_references

#

# This amendment may remain here at the end of the YAML until

# the canonical file is consolidated.

# ============================================================

editorial_amendments:

  repeated_footnote_markers:

    logical_location: "editorial_rules.cross_references"

    rule: >

      When an illuminated word or phrase refers to an existing

      numbered lexical footnote, the same superscript footnote

      number must appear at every applicable occurrence of that

      illuminated word or phrase. Repeated occurrences do not

      create new footnotes or new footnote numbers. They repeat

      the superscript reference to the already established note.

    example: >

      If raqia is associated with footnote 7, every applicable

      illuminated occurrence of raqia displays superscript 7 and

      refers to the same footnote 7.



