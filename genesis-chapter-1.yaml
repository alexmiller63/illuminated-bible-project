# ============================================================

# genesis-chapter-1.yaml

#

# THE ILLUMINATED BIBLE

# Genesis Chapter 1

#

# Canonical chapter source

#

# CONSOLIDATED VERSION

# Part 1 of several

# Header, presentation, and Genesis 1:1-10

# ============================================================

book: Genesis

chapter: 1

project:

  name: "The Illuminated Bible"

  motto: "Restrained Art. Eternal Truth."

  author: "Alexander Ferrari Miller"

# ============================================================

# CHAPTER PRESENTATION

# ============================================================

presentation:

  scripture_font_size: 14

  large_print:

    enabled: true

    rule: >

      Scripture must be rendered as genuine large print at 14 points.

      Scripture type must never be reduced merely to make additional

      verses fit on a page. The chapter must use as many pages as

      necessary to preserve the approved 14-point scripture size.

  source_label:

    enabled: true

    display:

      Basic English: BBE

      WEB: WEB

    size_points: 6

    position: inline_after_verse_number

    line_break_after: false

    rule: >

      In the illuminated left column, the verse number is followed

      immediately by the source label BBE or WEB in 6-point type.

      The verse text follows immediately on the same line. There must

      be no line break separating the source label from the verse text.

      The full name "Basic English" must not be printed as the source

      label in the scripture column.

  column_headings:

    enabled: false

    rule: >

      The scripture columns must not display headings or labels such as

      "Illuminated Text", "World English Bible", "WEB", or equivalent

      column titles.

  columns:

    illuminated:

      position: left

      english_weight: bold

      rule: >

        The complete English foundation text of every verse in the

        illuminated left column is bold. Hebrew, transliteration, IPA,

        superscript footnote markers, and the 6-point source label

        retain their own typography.

    comparison:

      position: right

      source: WEB

      english_weight: regular

    footnotes:

      position: far_right

      independent_flow: true

  verse_alignment:

    enabled: true

    rule: >

      The illuminated verse and corresponding WEB verse must begin

      at exactly the same vertical position. Each verse has one shared

      row-top coordinate. The height of the scripture row is determined

      by whichever scripture column requires more vertical space.

  pagination:

    mode: content_driven

    fixed_verses_per_page: false

    preserve_complete_verse_rows_when_practical: true

    deliberate_scripture_page_breaks: false

    rule: >

      There is no fixed number of verses per page. The renderer must fit

      as many verse rows on each page as naturally fit at the approved

      14-point scripture size. Shorter verses may allow more verses on

      a page; longer or more heavily illuminated verses may allow fewer.

      Scripture type must not be reduced to increase verse count.

      Deliberate page breaks must not be inserted between ordinary

      scripture rows merely to control visual placement.

  verse_spacing:

    blank_lines_between_verses: 0

    rule: >

      Consecutive scripture verse rows follow one another without

      inserted blank lines or artificial vertical gaps. Only the

      ordinary line spacing required by the typography may separate

      one verse row from the next.

  footnote_flow:

    rule: >

      Footnotes flow independently of scripture verse rows. A long

      footnote must not increase the height of its corresponding verse

      row or force later scripture verses downward. Footnotes may

      continue onto subsequent pages.

    preserve_complete_text: true

    continuous_spacing:

      enabled: true

      rule: >

        Numbered footnotes follow one another continuously in the

        footnote column with normal paragraph spacing only. Artificial

        blank areas must not be inserted between consecutive notes.

    page_association:

      enabled: true

      anticipatory_notes: false

      rule: >

        Footnotes are associated with the scripture page containing

        the verse that gives rise to them. A footnote must not appear

        on an earlier page merely because unused space is available

        in the footnote column.

        If a scripture page contains verses 1 through 12, only notes

        arising from verses 1 through 12 may begin on that page.

        A note belonging to verse 13 must begin on the page on which

        verse 13 appears.

        Footnotes continue to flow independently of scripture rows,

        and an unusually long note may continue onto a subsequent page.

    top_alignment:

      rule: >

        At the beginning of a scripture page, the top of the footnote

        column must align with the top of the scripture columns. The

        footnote column must not begin above or below the shared

        scripture starting position because of hidden paragraphs,

        table-cell spacing, or other rendering artifacts.

    prohibition: >

      Approved footnotes must never be shortened, summarized,

      paraphrased, weakened, or deleted merely to make a page fit.

    labeling:

      heading: null

      prohibit_status_labels: true

      rule: >

        Footnotes appear in the far-right footnote column without

        editorial status labels such as "NEW".

  hebrew:

    direction: rtl

    vocalization: fully_vocalized

    system: masoretic

    niqqud: true

    typography:

      category: hebrew_serif

      preferred_face: "Noto Serif Hebrew"

  transliteration:

    style: italic_serif

  ipa:

    style: readable_sans_serif

  table_borders:

    visible: false

  layout_integrity:

    rule: >

      Layout must yield to approved content, never the reverse.

      Approved illumination and footnotes must not be abbreviated,

      paraphrased, deleted, or rendered in smaller type merely to make

      material fit. Genesis 1:1-31 must be presented in full, using as

      many pages as necessary.

